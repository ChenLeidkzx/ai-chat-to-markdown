<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body { width: 280px; font-family: system-ui, sans-serif; padding: 14px; color: #1f2937; }
h1 { font-size: 16px; margin: 0 0 6px; }
p { font-size: 13px; line-height: 1.5; color: #4b5563; margin: 0 0 12px; }
button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #1e4078; color: #fff; font-size: 14px; cursor: pointer; }
button:hover { background: #16305c; }
#status { font-size: 12px; color: #4b5563; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
<h1>AI Chat to Markdown</h1>
<p>Open a ChatGPT conversation, then export it to a Markdown file. Everything runs locally in your browser.</p>
<button id="exportBtn">Export to Markdown</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
